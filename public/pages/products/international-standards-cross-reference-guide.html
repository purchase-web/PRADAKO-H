    <!--
        DATA ARCHITECTURE
        -----------------
        1. Products-page standards data remains the Cross-Reference source:
             pradakoProductTypes
             pradakoSubtypeData
             pradakoStandardsBySubtype

        2. Customised Products catalogue supplies canonical product identity:
             window.PMEW_CUSTOM_PRODUCT_CATALOG
             -> product id
             -> PRADAKO part number
             -> image
             -> product URL
             -> family/category

        3. The shared enquiry system is the SAME system used on Customised
           Products / PDP pages:
             window.PradakoEnquiryCart

        4. Standards links can resolve against the Standards Library dataset.
           The guide first looks for a loaded/shared standards data record and
           falls back to a predictable /standards/{authority}/{slug}.html path.
    -->
    <main
        id="internationalCrossReferenceApp"
        class="pmew-independent-crossref-app"
        data-source-page="/pages/products/products.html"
        data-products-script-fallback="/js/products.js"
        data-standards-page="/pages/specifications/specifications.html"
        data-standards-script-fallback="/js/specifications-data.js"
    >
        <section
            id="internationalCrossReferenceMount"
            class="pmew-independent-crossref-loading"
            aria-live="polite"
            aria-busy="true"
        >
            <div class="pmew-independent-crossref-loading-inner">

                <p class="pmew-independent-crossref-loading-text">
                    Loading the current standards and PRADAKO product data…
                </p>
            </div>
        </section>
