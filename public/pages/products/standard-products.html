<body class="pmew-standard-products-page">

    <div id="navbar-container"></div>

    <!--
        INDEPENDENT STANDARD PRODUCTS PAGE
        ----------------------------------
        This page carries its own copy of the catalogue markup,
        styling and data. It does not read from /products.html and
        it does not load /js/products.js or /assets/css/products.css, so a
        change on the Products page cannot break this one.

        Deep links accepted:
          /standard-products.html?type=Nuts#standards
          /standard-products.html?type=Screws&subtype=Machine%20Screws#standards
          /standard-products.html?family=DIN#standards
          add &view=list to any of the above
    -->
    <main id="standardProductsMain">

    <section id="standards" class="pradako-products-info-section">

        <div class="container">

            <h2 class="pradako-products-section-title">
                SOME OF OUR STANDARD PRODUCTS
            </h2>

            <div class="pradako-products-controls">

                <div class="pradako-products-filter-toggle">

                    <button class="pradako-products-toggle-btn active"
                            id="typeViewBtn">
                        By Standard (Type)
                    </button>

                    <button class="pradako-products-toggle-btn"
                            id="standardViewBtn">
                        By Standard (Number)
                    </button>

                </div>

                <div class="pradako-products-search-box">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>

                    <input
                        type="search"
                        id="productSearch"
                        placeholder="Search product or type..."
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        class="pradako-products-search-clear"
                        id="productSearchClear"
                        aria-label="Clear search"
                    >
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
            

                <div class="pradako-products-view-actions">
                    <button type="button" class="pradako-products-action-btn active" data-view="grid">
                        <i class="fa-solid fa-grip"></i>
                        <span>Grid</span>
                    </button>

                    <button type="button" class="pradako-products-action-btn" data-view="list">
                        <i class="fa-solid fa-list-ul" aria-hidden="true"></i>
                        <span>List</span>
                    </button>

                    <button type="button" class="pradako-products-action-btn export" data-export="true">
                        <i class="fa-solid fa-file-export" aria-hidden="true"></i>
                        <span>Export</span>
                    </button>
                </div>

            </div>

        

            <nav id="catalogueBreadcrumb"
                class="pradako-catalogue-breadcrumb"
                aria-label="Standard products breadcrumb">

                <button type="button"
                        class="pmew-breadcrumb-item"
                        data-breadcrumb-action="mode-type">
                    Home
                </button>

                <strong class="pmew-breadcrumb-item">
                    By Standard (Type)
                </strong>

            </nav>

            <div class="pradako-catalogue-head">
                <div>
                    <h3 id="catalogueTitle">Browse by Type</h3>
                    <p id="catalogueSubtitle">
                        Select Screws, Socket Screws, Nuts, Washers, Bolts, Threaded Rods / Studs, Structural Bolts or Rivets.
                    </p>
                </div>

                <span class="pradako-catalogue-count">
                    <i></i>
                    <span id="catalogueCount">0 entries</span>
                </span>
            </div>

            <div id="catalogueContent" class="pradako-products-standards-grid grid-view">
            
            </div>

            <div id="catalogueEmpty" class="pradako-catalogue-empty">
                No matching products found.
            </div>

            <div id="catalogueDetail" class="pradako-catalogue-detail-shell">
            </div>

        </div>

    </section>

    </main>
