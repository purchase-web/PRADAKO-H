<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PMEW — Premium Thread Rolling Loader</title>

<style>
:root{
  --bg:#ffffff;
  --ink:#111315;
  --muted:#7b8288;
  --line:#d9dee2;
  --accent:#f08080;

  --steel-hi:#f7f9fa;
  --steel-1:#dfe3e6;
  --steel-2:#aab1b7;
  --steel-3:#727b82;
  --steel-4:#3d444a;
  --steel-5:#202428;

  --die-hi:#f5f7f8;
  --die-mid:#cfd5d9;
  --die-dark:#8f989f;

  --cycle:1.78s;
  --fade:360ms;
}

*,
*::before,
*::after{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
}

html.pmew-loader-lock,
html.pmew-loader-lock body{
  overflow:hidden !important;
}

body{
  min-height:100vh;
  font-family:
    Inter,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* =========================================================
   FULL-SCREEN LOADER
========================================================= */

#pmew-loader{
  position:fixed;
  inset:0;
  z-index:999999;

  display:grid;
  place-items:center;

  overflow:hidden;

  background:
    radial-gradient(circle at 50% 44%,
      #ffffff 0%,
      #ffffff 58%,
      #fbfbfb 80%,
      #f7f7f7 100%);

  opacity:1;
  visibility:visible;

  transition:
    opacity var(--fade) cubic-bezier(.22,.61,.36,1),
    visibility var(--fade) linear;
}

#pmew-loader::before{
  content:"";
  position:absolute;
  left:50%;
  top:49%;

  width:min(70vw,620px);
  aspect-ratio:1;

  transform:translate(-50%,-50%);
  border-radius:50%;

  background:
    radial-gradient(circle,
      rgba(17,19,21,.025) 0%,
      rgba(17,19,21,.012) 34%,
      transparent 70%);

  pointer-events:none;
}

#pmew-loader.is-hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.pmew-loader__inner{
  position:relative;

  width:min(92vw,560px);

  display:grid;
  justify-items:center;

  transform:translateY(-8px);
}

.pmew-loader__visual{
  position:relative;

  width:100%;
  min-height:230px;
}

.pmew-loader__svg{
  position:absolute;
  left:50%;
  top:50%;

  width:min(96%,500px);
  height:auto;

  overflow:visible;

  transform:translate(-50%,-50%);
}

/* =========================================================
   SIMPLE LOADING COPY
========================================================= */

.pmew-loader__label{
  margin-top:-4px;

  color:#747b81;

  font-size:10px;
  font-weight:650;
  letter-spacing:.22em;
  text-transform:uppercase;

  opacity:.72;

  animation:
    pmewLoadingPulse
    1.25s
    ease-in-out
    infinite;
}

/* =========================================================
   REALISTIC MECHANICAL MOTION
========================================================= */

.pmew-loader__die,
.pmew-loader__blank,
.pmew-loader__socket,
.pmew-loader__thread,
.pmew-loader__sheen,
.pmew-loader__part-shadow,
.pmew-loader__contact-line{
  transform-box:fill-box;
}

.pmew-loader__die{
  transform-origin:center;
}

.pmew-loader__die--top{
  transform:translate3d(0,0,0);
}

.pmew-loader__die--bottom{
  animation:
    pmewDieStroke
    var(--cycle)
    cubic-bezier(.42,0,.22,1)
    infinite;
}

.pmew-loader__blank{
  transform-origin:center;

  animation:
    pmewBlankAdvance
    var(--cycle)
    cubic-bezier(.42,0,.22,1)
    infinite;
}

.pmew-loader__socket{
  transform-origin:center;

  animation:
    pmewSocketTurn
    var(--cycle)
    cubic-bezier(.42,0,.22,1)
    infinite;
}

.pmew-loader__thread{
  transform-origin:left center;

  opacity:0;

  animation:
    pmewThreadForm
    var(--cycle)
    cubic-bezier(.18,.76,.22,1)
    infinite;
}

.pmew-loader__sheen{
  transform-origin:center;

  opacity:0;

  animation:
    pmewThreadSheen
    var(--cycle)
    cubic-bezier(.4,0,.2,1)
    infinite;
}

.pmew-loader__part-shadow{
  transform-origin:center;

  animation:
    pmewShadowBreath
    var(--cycle)
    ease-in-out
    infinite;
}

.pmew-loader__contact-line{
  transform-origin:center;

  animation:
    pmewContactPulse
    var(--cycle)
    ease-in-out
    infinite;
}

/* =========================================================
   KEYFRAMES
========================================================= */

@keyframes pmewDieStroke{
  0%,
  12%{
    transform:translate3d(-12px,0,0);
  }

  62%{
    transform:translate3d(12px,0,0);
  }

  82%{
    transform:translate3d(12px,0,0);
  }

  100%{
    transform:translate3d(-12px,0,0);
  }
}

@keyframes pmewBlankAdvance{
  0%,
  12%{
    transform:translate3d(-2px,0,0);
  }

  62%{
    transform:translate3d(4px,0,0);
  }

  82%{
    transform:translate3d(5px,0,0);
  }

  100%{
    transform:translate3d(-2px,0,0);
  }
}

@keyframes pmewSocketTurn{
  0%,
  12%{
    transform:rotate(0deg);
  }

  62%{
    transform:rotate(14deg);
  }

  82%{
    transform:rotate(18deg);
  }

  100%{
    transform:rotate(0deg);
  }
}

@keyframes pmewThreadForm{
  0%,
  15%{
    opacity:0;
    clip-path:inset(0 100% 0 0);
  }

  31%{
    opacity:.6;
    clip-path:inset(0 82% 0 0);
  }

  50%{
    opacity:1;
    clip-path:inset(0 48% 0 0);
  }

  69%,
  88%{
    opacity:1;
    clip-path:inset(0 0 0 0);
  }

  100%{
    opacity:0;
    clip-path:inset(0 0 0 0);
  }
}

@keyframes pmewThreadSheen{
  0%,
  37%{
    opacity:0;
    transform:translate3d(-34px,0,0);
  }

  48%{
    opacity:.42;
  }

  72%{
    opacity:.08;
    transform:translate3d(132px,0,0);
  }

  100%{
    opacity:0;
    transform:translate3d(132px,0,0);
  }
}

@keyframes pmewShadowBreath{
  0%,
  100%{
    opacity:.075;
    transform:scaleX(.985);
  }

  60%{
    opacity:.12;
    transform:scaleX(1.015);
  }
}

@keyframes pmewContactPulse{
  0%,
  17%,
  100%{
    opacity:.12;
  }

  48%,
  68%{
    opacity:.42;
  }
}

@keyframes pmewLoadingPulse{
  0%,
  100%{
    opacity:.42;
  }

  50%{
    opacity:.86;
  }
}

/* =========================================================
   PAGE CONTENT
========================================================= */

#site-content{
  min-height:100vh;

  opacity:0;

  transition:
    opacity .42s cubic-bezier(.22,.61,.36,1);
}

body.pmew-page-ready #site-content{
  opacity:1;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width:600px){
  .pmew-loader__inner{
    width:96vw;
    transform:translateY(-4px);
  }

  .pmew-loader__visual{
    min-height:195px;
  }

  .pmew-loader__svg{
    width:min(95%,420px);
  }

  .pmew-loader__label{
    margin-top:-8px;
    font-size:9px;
  }
}

@media (max-width:420px){
  .pmew-loader__visual{
    min-height:176px;
  }

  .pmew-loader__svg{
    width:min(96%,360px);
  }
}

@media (max-height:620px){
  .pmew-loader__inner{
    transform:scale(.9) translateY(-3px);
  }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion:reduce){
  .pmew-loader__die--bottom,
  .pmew-loader__blank,
  .pmew-loader__socket,
  .pmew-loader__thread,
  .pmew-loader__sheen,
  .pmew-loader__part-shadow,
  .pmew-loader__contact-line,
  .pmew-loader__label{
    animation:none !important;
  }

  .pmew-loader__thread{
    opacity:1;
    clip-path:inset(0 0 0 0);
  }

  .pmew-loader__label{
    opacity:.68;
  }
}
</style>

<script>
(() => {
  "use strict";

  const loader = document.getElementById("pmew-loader");
  const root = document.documentElement;
  const body = document.body;

  if (!loader) return;

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  /*
   * Production defaults:
   * - enough time for the loader to read as intentional
   * - no fake progress percentage
   * - hard safety release
   */
  const MINIMUM_VISIBLE = reducedMotion ? 180 : 1400;
  const MAXIMUM_WAIT = 5000;
  const FADE_MS = 420;

  let ready =
    document.readyState === "interactive" ||
    document.readyState === "complete";

  let minimumDone = false;
  let closed = false;

  function setBusy(isBusy){
    root.setAttribute("aria-busy", isBusy ? "true" : "false");
    root.classList.toggle("pmew-loader-lock", isBusy);
  }

  function finish(){
    if (closed) return;
    closed = true;

    body.classList.add("pmew-page-ready");
    setBusy(false);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        loader.classList.add("is-hidden");
      });
    });

    window.setTimeout(() => {
      if (loader.parentNode) loader.remove();
    }, FADE_MS + 80);
  }

  function evaluate(){
    if (ready && minimumDone){
      finish();
    }
  }

  function show(){
    if (!loader) return;

    closed = false;
    loader.classList.remove("is-hidden");
    setBusy(true);
  }

  function hide(){
    finish();
  }

  /*
   * Initial page load
   */
  show();

  if (!ready){
    document.addEventListener(
      "DOMContentLoaded",
      () => {
        ready = true;
        evaluate();
      },
      { once:true }
    );
  }

  window.setTimeout(() => {
    minimumDone = true;
    evaluate();
  }, MINIMUM_VISIBLE);

  /*
   * Never allow the loader to trap the visitor.
   */
  window.setTimeout(finish, MAXIMUM_WAIT);

  /*
   * bfcache restore
   */
  window.addEventListener(
    "pageshow",
    event => {
      if (event.persisted){
        finish();
      }
    },
    { once:true }
  );

  /*
   * Optional public API for future internal-navigation use.
   */
  window.PMEWPageLoader = {
    show,
    hide
  };
})();
</script>
